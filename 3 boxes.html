<!DOCTYPE html>
<html>
    <head>
        <title>3 DIFFERENT BOXES</title>
        <style>
            .box1{
                width: 150px;
                height: 150px;
                background-color: red;
                text-align: center;
                border: 4px solid green;
                border-radius: 10px;
            }
            .box2{
                width: 150px;
                height: 150px;
                background-color: blueviolet;
                text-align: end;
                border: 5px solid pink;
                border-radius: 50px;
            }
            .box3{
                 width: 150px;
                height: 150px;
                background-color: green;
                text-align:left;
                border: 3px solid black;
                border-radius: 100px;
            }
            .box4{
                width: 150px;
                height: 150px;
                background-color: aqua;
                text-align: end;
                border: 4px solid red;
                border-radius:150px ;
            }
        </style>
    </head>
    <body>
        <div class="box1">box1</div><br>
        <div class="box2">box2</div><br>
        <div class="box3">box3</div><br>
        <div class="box4">box4</div>
    </body>
</html>
